<svg xmlns="http://www.w3.org/2000/svg" width="460" height="780" viewBox="0 0 460 780">
  <defs>
    <linearGradient id="stripes" x1="0" x2="1">
      <stop offset="0" stop-color="#D60E3A"/><stop offset=".2" stop-color="#D60E3A"/>
      <stop offset=".2" stop-color="#D17200"/><stop offset=".4" stop-color="#D17200"/>
      <stop offset=".4" stop-color="#D3A801"/><stop offset=".6" stop-color="#D3A801"/>
      <stop offset=".6" stop-color="#019589"/><stop offset=".8" stop-color="#019589"/>
      <stop offset=".8" stop-color="#02696E"/><stop offset="1" stop-color="#02696E"/>
    </linearGradient>
    <pattern id="lcdgrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0H0V4" fill="none" stroke="#3E5228" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <!-- Body -->
  <g id="body">
    <path d="M18 2H442A16 16 0 0 1 458 18V680A98 98 0 0 1 360 778H18A16 16 0 0 1 2 762V18A16 16 0 0 1 18 2Z"
          fill="#E9DCCB" stroke="#211B16" stroke-width="2"/>
    <path d="M8 762V18A10 10 0 0 1 18 8H442" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2"/>
    <path d="M452 680A92 92 0 0 1 360 772H18" fill="none" stroke="#CBB9A4" stroke-width="6"/>
  </g>

  <!-- Top labels -->
  <g font-family="Archivo, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#6B5E52">
    <text x="26" y="34">◂ OFF · ON ▸</text>
  </g>

  <!-- Screen bezel -->
  <g id="bezel">
    <path d="M38 52H422A12 12 0 0 1 434 64V432A50 50 0 0 1 384 482H38A12 12 0 0 1 26 470V64A12 12 0 0 1 38 52Z" fill="#33363D"/>
    <circle cx="50" cy="78" r="4" fill="#D60E3A"/>
    <text x="62" y="81" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="8" letter-spacing="2.5" fill="#CBB9A4">BATTERY</text>
    <rect x="320" y="74" width="96" height="6" rx="3" fill="url(#stripes)"/>
  </g>

  <!-- Empty LCD: place your interactive HTML on top of this area (x=46 y=98 w=368 h=362) -->
  <g id="lcd">
    <rect x="46" y="98" width="368" height="362" rx="3" fill="#B9C579"/>
    <rect x="46" y="98" width="368" height="362" rx="3" fill="url(#lcdgrid)"/>
  </g>

  <!-- Wordmark -->
  <text x="26" y="520" font-size="20" fill="#25357A" font-style="italic">
    <tspan font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="900">Rcade</tspan><tspan font-family="'Instrument Serif', 'Times New Roman', serif" font-weight="400">GB</tspan><tspan font-family="Archivo, Helvetica, sans-serif" font-size="9" font-weight="900" font-style="normal" dy="-8">TM</tspan>
  </text>

  <!-- D-pad -->
  <g id="dpad" fill="#16110E">
    <rect x="58" y="556" width="34" height="100" rx="6"/>
    <rect x="25" y="589" width="100" height="34" rx="6"/>
    <circle cx="75" cy="606" r="7" fill="#2C2622"/>
  </g>

  <!-- Empty button area for BACK / SUBMIT: x=260 y=540 w=180 h=120 -->

  <!-- Select / Start -->
  <g fill="#6B5E52">
    <rect x="44" y="700" width="48" height="12" rx="6" transform="rotate(-20 68 706)"/>
    <rect x="116" y="700" width="48" height="12" rx="6" transform="rotate(-20 140 706)"/>
  </g>
  <g font-family="Archivo, Helvetica, Arial, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5" fill="#25357A">
    <text x="44" y="738" transform="rotate(-20 68 734)">SELECT</text>
    <text x="120" y="738" transform="rotate(-20 140 734)">START</text>
  </g>

  <!-- Speaker -->
  <g fill="#CBB9A4" transform="rotate(-25 360 690)">
    <rect x="318" y="660" width="8" height="58" rx="4"/>
    <rect x="336" y="660" width="8" height="58" rx="4"/>
    <rect x="354" y="660" width="8" height="58" rx="4"/>
    <rect x="372" y="660" width="8" height="58" rx="4"/>
    <rect x="390" y="660" width="8" height="58" rx="4"/>
  </g>
</svg>
