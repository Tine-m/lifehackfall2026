
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass</title>

    <!-- Forbinder HTML med vores CSS -->
    <link rel="stylesheet" href="/css/teame/style.css">
</head>

<body>

<!-- Sidens overskrift -->
<header>
    <h1>Secure<span>Pass</span></h1>
    <p>Hold dine passwords sikre og stærke</p>
</header>

<!-- Indeholder de to bokse -->
<main class="container">

    <!-- Boks til password generator -->
    <div class="box">
        <h2>Password Generator</h2>
        <p>Lav et stærkt og sikkert password.</p>

        <!-- Her skal det genererede password vises -->
        <input type="text"
               placeholder="Dit password vises her"
               readonly>
    </div>

    <!-- Boks til password tjekker -->
    <div class="box">
        <h2>Password Tjekker</h2>
        <p>Tjek hvor sikkert dit password er.</p>

        <!-- Her kan brugeren skrive sit password -->
        <input type="password"
               placeholder="Indtast dit password">
    </div>

</main>

<!-- Tekst nederst på siden -->
<footer>
    <p>SecurePass - Team E</p>
</footer>

</body>
</html>
