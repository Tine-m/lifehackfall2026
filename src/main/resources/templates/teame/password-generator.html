
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecurePass</title>
    <link rel="stylesheet" href="/css/teame/style.css">
    <script src="/js/teame/copy.js" defer></script>
</head>

<body>

<header class="securepass-header">
    <svg class="securepass-logo"
         xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 60 70">

        <path d="M30 5 L53 14 V34
                 C53 49 42 58 30 65
                 C18 58 7 49 7 34 V14 Z"
              fill="none"
              stroke="#8B5CF6"
              stroke-width="5"/>

        <path d="M24 33 V27 A6 6 0 0 1 36 27 V33"
              fill="none"
              stroke="#8B5CF6"
              stroke-width="4"/>

        <rect x="20" y="33"
              width="20" height="17"
              rx="3"
              fill="#8B5CF6"/>
    </svg>

    <h1>Secure<span>Pass</span></h1>
</header>

<main class="container">

    <div class="box">
        <h2>Password Generator</h2>

        <p class="message" th:if="${message}" th:text="${message}"></p>

        <!-- Genereret password og kopiér-knap -->
        <div class="result">
            <input type="text"
                   id="password"
                   placeholder="Dit password vises her"
                   readonly
                   th:value="${password}">

            <button type="button" id="copy-button">Kopiér</button>
        </div>

        <p class="copied" id="copied" hidden>Kopieret!</p>

        <!-- Passwordets styrke -->
        <p class="strength" th:if="${strength}">
            Styrke:
            <span th:text="${strength}"
                  th:class="'strength-' + ${strength}"></span>
        </p>

        <!-- Skabeloner -->
        <form method="post"
              action="/securepass/template"
              class="template-form"
              th:if="${!templates.isEmpty()}">

            <label for="templateId">Skabelon</label>

            <select id="templateId" name="templateId">
                <option th:each="template : ${templates}"
                        th:value="${template.templateId}"
                        th:text="${template.name}"
                        th:selected="${template.templateId == selectedTemplateId}">
                </option>
            </select>

            <button type="submit">Brug skabelon</button>
        </form>

        <!-- Indstillinger til passwordgeneratoren -->
        <form method="post" action="/securepass/generate">

            <fieldset>
                <legend>Indstillinger</legend>

                <label for="length">Længde (8–128)</label>

                <input type="text"
                       id="length"
                       name="length"
                       inputmode="numeric"
                       th:value="${length}">

                <label th:each="type : ${characterTypes}">
                    <input type="checkbox"
                           name="characterTypeId"
                           th:value="${type.characterTypeId}"
                           th:checked="${#lists.contains(selectedTypeIds, type.characterTypeId)}">

                    <span th:text="${type.name}"></span>
                </label>

                <label>
                    <input type="checkbox"
                           name="excludeAmbiguous"
                           th:checked="${excludeAmbiguous}">

                    Undgå forvekslelige tegn (0/O, l/1/I)
                </label>
            </fieldset>

            <button type="submit"
                    th:text="${password} ? 'Generér igen' : 'Generér'">
                Generér
            </button>

        </form>

    </div>

</main>

</body>
</html>
