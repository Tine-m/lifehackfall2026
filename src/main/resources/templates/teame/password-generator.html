<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecurePass</title>
    <link rel="stylesheet" href="/css/teame/style.css">
    <script src="/js/teame/copy.js" defer></script>
</head>

<body>

<h1>SecurePass</h1>

<main class="container">

    <div class="box">
        <h2>Password Generator</h2>

        <p class="message" th:if="${message}" th:text="${message}"></p>

        <!-- Det genererede password med kopiér-knap og styrke -->
        <div class="result">
            <input type="text" id="password" placeholder="Dit password vises her" readonly
                   th:value="${password}">
            <button type="button" id="copy-button">Kopiér</button>
        </div>
        <p class="copied" id="copied" hidden>Kopieret!</p>
        <p class="strength" th:if="${strength}">
            Styrke: <span th:text="${strength}" th:class="'strength-' + ${strength}"></span>
        </p>

        <!-- Skabeloner udfylder indstillingerne nedenfor -->
        <form method="post" action="/securepass/template" class="template-form" th:if="${!templates.isEmpty()}">
            <label for="templateId">Skabelon</label>
            <select id="templateId" name="templateId">
                <option th:each="template : ${templates}"
                        th:value="${template.templateId}"
                        th:text="${template.name}"
                        th:selected="${template.templateId == selectedTemplateId}"></option>
            </select>
            <button type="submit">Brug skabelon</button>
        </form>

        <!-- Indstillinger. Formularen sendes igen ved "Generér igen", så valgene bevares -->
        <form method="post" action="/securepass/generate">

            <fieldset>
                <legend>Indstillinger</legend>
                <label for="length">Længde (8–128)</label>
                <input type="text" id="length" name="length" inputmode="numeric" th:value="${length}">

                <label th:each="type : ${characterTypes}">
                    <input type="checkbox" name="characterTypeId"
                           th:value="${type.characterTypeId}"
                           th:checked="${#lists.contains(selectedTypeIds, type.characterTypeId)}">
                    <span th:text="${type.name}"></span>
                </label>

                <label>
                    <input type="checkbox" name="excludeAmbiguous" th:checked="${excludeAmbiguous}">
                    Undgå forvekslelige tegn (0/O, l/1/I)
                </label>
            </fieldset>

            <button type="submit" th:text="${password} ? 'Generér igen' : 'Generér'">Generér</button>
        </form>
    </div>

    <div class="box">
        <h2>Password Tjekker</h2>
    </div>

</main>

</body>
</html>
