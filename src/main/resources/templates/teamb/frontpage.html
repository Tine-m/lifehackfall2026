<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifehack Memory Game</title>
    <link rel="stylesheet" th:href="@{/css/teamb/frontpage.css}"/>
</head>

<body>

<main class="game-container">

    <div class="background"></div>

    <div class="game-content">

        <h1 class="game-title">
            <span class="title-word">
                <span class="blue">M</span><span class="red">e</span><span class="green">m</span><span class="yellow">o</span><span class="blue">r</span><span class="red">y</span>
            </span>

            <span class="title-word">
                <span class="green">G</span><span class="yellow">a</span><span class="blue">m</span><span class="red">e</span>
            </span>
        </h1>

        <nav class="menu-buttons">

            <!-- Lifehack mode: lifehack vises når par er fundet -->
            <form th:action="@{/game}" method="get">
                <input type="hidden" name="mode" value="lifehack"/>
                <button type="submit" class="menu-button">Start lifehack</button>
            </form>

            <!-- Klassisk mode -->
            <form th:action="@{/game}" method="get">
                <input type="hidden" name="mode" value="classic"/>
                <button type="submit" class="menu-button">Start klassisk</button>
            </form>

           <!-- <a th:href="@{/results}" class="menu-button menu-link">Leaderboard</a>-->
            <form th:action="@{/results}" method="get">
                <button type="submit" class="menu-button">Leaderboard</button>
            </form>

        </nav>

    </div>

</main>

</body>
</html>
