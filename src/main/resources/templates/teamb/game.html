<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game On</title>
    <link rel="stylesheet" th:href="@{/css/teamb/game.css}"/>
    <script th:src="@{/js/teamb/cards-logic.js}" defer></script>
    <script th:src="@{/js/teamb/game-stats.js}" defer></script>
</head>
<body>
<div class="container">
    <h1 class="title"
        th:text="${mode == 'lifehack'} ? 'Lifehack Memory Game' : 'Klassisk Memory Game'">Lifehack Memory Game</h1>


    <div class="layout">
        <!-- Board: cards are rendered server-side from the "cards" model attribute -->
        <section class="board-area">
            <div class="board" id="board"
                 th:attr="data-mode=${mode}, data-total-pairs=${totalPairs}">

                <div class="card"
                     th:each="card : ${cards}"
                     th:attr="data-card-id=${card.cardId}, data-pair-id=${card.pairId}, data-hack=${card.lifehackDescription}"
                     tabindex="0">
                    <div class="card-inner">
                        <div class="card-front">LH</div>
                        <div class="card-back">
                            <img th:if="${card.imageURL != null}"
                                 th:src="@{${card.imageURL}}"
                                 th:alt="${card.text}"/>
                            <span th:text="${card.text}">Tekst</span>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Sidebar: timer, pairs, moves -->
        <aside class="sidebar">
            <div class="stat" id="timer">Timer: 00:00</div>
            <div class="stat" id="matched" th:text="'Matched pairs: 0/' + ${totalPairs}">Matched pairs: 0/8</div>
            <div class="stat" id="moves">Moves: 0</div>

            <!-- Vises kun i lifehack mode -->
            <div class="hack-panel" th:if="${mode == 'lifehack'}">
                <h2>Fundne life hacks</h2>
                <ul id="hack-list"></ul>
            </div>


            <button id="finish-game" class="finish-button" type="button">
                Afslut spil
            </button>

            <form id="finish-form" method="post" action="/results" hidden>
                <input type="hidden" name="time" id="finish-time">
                <input type="hidden" name="moves" id="finish-moves">
                <input type="hidden" name="mode" th:value="${mode}">
                <input type="hidden" name="completed" id="finish-completed" value="false">
            </form>


        </aside>
    </div>
</div>

</body>
</html>
