<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game On</title>
    <link rel="stylesheet" href="/css/teamb/game.css"/>
</head>
<body>
    <div class="container">
        <h1 class="title">Lifehack Memory Spil</h1>

        <div class="layout">
            <!-- Selve "spillepladen med de 16 kort i gitter -->
            <section class="board-area">
                <div class="board" id="board">
                    <!-- Kortene indsættes via js eller? -->
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front">LH</div>
                            <div class="card-back"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Sidebar med timer, matched pairs og antal moves der alle tæller op -->
            <aside class="sidebar">
                <div class="stat" id="timer">Timer: 0 sec</div>
                <div class="stat" id="matched">Matched pairs: 0/8</div>
                <div class="stat" id="moves">Moves: 0</div>

                <div class="hack-panel">
                    <h2>Fundne life hacks</h2>
                    <ul id="hack-list">
                        <!-- Beskrivelser indsættes af .js??? -->
                    </ul>
                </div>

                <button id="finish-game" class="finish-button" disabled>Afslut spil</button>
            </aside>
        </div>
    </div>

    <script>

        async function loadGameBoard() {
            const board = document.getElementById('board');

            try {
                const res = await fetch('/cards');
                if (!res.ok) throw new Error('Status ' + res.status);

                const cards = await res.json();
                board.innerHTML = '';
                cards.forEach(card => board.appendChild(createCard(card)));
            } catch (err) {
                console.error(err);
                board.textContent = 'Kort kunne ikke læses!';
            }
        }

        function createCard(card) {
            const el = document.createElement('div');
            el.className = 'card';
            el.dataset.cardId = card.cardId;
            el.dataset.pairId = card.pairId;

            const inner = document.createElement('div');
            inner.className = 'card-inner';

            // Kortets forside
            const front = document.createElement('div');
            front.className = 'card-front';
            front.textContent = 'LH';

            // Kortets bagside
            const back = document.createElement('div');
            back.className = 'card-back';

            if (card.imageURL) {
                const img = document.createElement('img');
                img.src = card.imageURL;
                back.appendChild(img);
            }
            if (card.text) {
                const span = document.createElement('span');
                span.textContent = card.text;
                // emoji-kort får en ekstra klasse, så de vises større
                if (/\p{Extended_Pictographic}/u.test(card.text)) {
                    back.classList.add('emoji');
                }
                back.appendChild(span);
            }

            inner.appendChild(front);
            inner.appendChild(back);
            el.appendChild(inner);

            el.addEventListener('click', () => handleCardClick(el));
            return el;
        }

        loadGameBoard();


        function handleCardClick(el) {
            //US2: vende to kort ad gangen..
            return null;
        }


    </script>

</body>
</html>
