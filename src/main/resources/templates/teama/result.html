<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RcadeGB | Result</title>
    <link rel="icon" type="image/x-icon" href="images/teama/rcade-logo.svg">
    <link rel="stylesheet" href="/css/teama/colours.css">
    <link rel="stylesheet" href="/css/teama/style.css">
    <link rel="stylesheet" href="/css/teama/result_style.css">

</head>
<body>

<div class="grid-one">

    <div class="grid-one-item home-button" style="grid-area: box-1">

        <a href="/">
            <img src="/images/teama/homebutton.svg" alt="">
        </a>

    </div>

    <div class="grid-one-item header-logo" style="grid-area: logo">
        <a href="/rcade">
            <img src="/images/teama/RcadeGB-header-logo.svg">
        </a>
    </div>

    <div class="grid-one-item" style="grid-area: box-2"></div>

    <div class="grid-one-item scoreboard" style="grid-area: box-3">
        <p class="scoreboard-title">High scores</p>
        <p class="scoreboard-title-period">Today</p>
        <table>
            <tr>
                <th class="rank">Rank</th>
                <th class="score">Score</th>
                <th class="initials">Name</th>
            </tr>
            <tr th:each="score, stat : ${session.todayList}" th:if="${stat.index < 5}">
                <td class="rank" th:text="${stat.count}">1</td>
                <td class="score" th:text="${score.total}"></td>
                <td class="initials" th:text="${score.initials}"></td>
            </tr>
        </table>
        <p class="scoreboard-title-period">This week</p>
        <table>
            <tr>
                <th class="rank">Rank</th>
                <th class="score">Score</th>
                <th class="initials">Name</th>
            </tr>
            <tr th:each="score, stat : ${session.weekList}" th:if="${stat.index < 5}">
                <td class="rank" th:text="${stat.count}">1</td>
                <td class="score" th:text="${score.total}"></td>
                <td class="initials" th:text="${score.initials}"></td>
            </tr>
        </table>
    </div>

    <div class="grid-one-item game" style="grid-area: box-4">

        <div class="gameboy-grid">
            <img id="gameboy-image" src="/images/teama/console_RcadeGB.svg" alt="gameboy">
            <div class="child-1 child"></div>
            <div class="child-2 child"></div>
            <div class="child-3 child"></div>
            <div class="child-4 child"></div>

            <div class="child-5 child"> <!-- SCREEN -->

                <div id="result-page">

                    <h3 style="grid-area: area-1" th:text="'Din Score: '+${session.game.getScore()}"></h3>

                    <div style="grid-area: area-2" th:if="${onHighscore}">
                        <p th:text="${highscoreMessage}">Error: Highscores could not be loaded</p>

                        <form action="/rcade/savescore" method="post">
                            <label for="initials">indtast initialer</label>
                            <input type="text" id="initials" name="initials" placeholder="ABC" required>
                            <button class="resultScreenButton" type="submit" id="submitInitials">
                                indsend score
                            </button>
                        </form>
                    </div>

                    <div class="resultScreenButtons" style="grid-area: area-3">

                        <form action="/rcade/playAgain">
                            <button type="submit" class="resultScreenButton" id="playAgain">
                                Prøv igen?
                            </button>
                        </form>

                        <form action="/rcade/nextLevel" method="get">
                            <button type="submit" class="resultScreenButton" id="playNextLevel"
                                    th:classappend="${!isNextLevelOpen} ? 'buttonLocked'">
                                Spil næste niveau!
                            </button>
                        </form>

                        <form action="/rcade">
                            <button type="submit" class="resultScreenButton" id="backToOverview">
                                tilbage til oversigt
                            </button>
                        </form>

                    </div>
                </div>
            </div>

            <div class="child-6 child"></div>
            <div class="child-7 child"></div>
            <div class="child-8 child"></div>
            <div class="child-9 child"></div>
        </div>
    </div>

    <div class="grid-one-item scoreboard scoreboard-alltime" style="grid-area: box-5">
        <p class="scoreboard-title">High scores</p>
        <p class="scoreboard-title-period">All time</p>
        <table>
            <tr>
                <th class="rank">Rank</th>
                <th class="score">Score</th>
                <th class="initials">Name</th>
                <th class="date">Date</th>
            </tr>
            <tr th:each="score, stat : ${session.allTimeList}" th:if="${stat.index < 10}">
                <td class="rank" th:text="${stat.count}">1</td>
                <td class="score" th:text="${score.total}"></td>
                <td class="initials" th:text="${score.initials}"></td>
                <td class="date" th:text="${score.dateDay + '/' + score.dateMonth}"></td>
            </tr>
        </table>
    </div>

</div>
</body>
</html>
