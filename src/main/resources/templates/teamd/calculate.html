<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Beregn</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/teamd/tokens.css"/>
    <link rel="stylesheet" href="/css/teamd/styles.css"/>
    <link rel="stylesheet" href="/css/teamd/calculate.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
</head>

<body>

<header class="topbar">
    <a href="/perfectfit" class="logo">PERFECTFIT</a>
    <nav>
        <a href="/perfectfit/calculate" class="active">Beregn</a>
        <a href="/perfectfit/measure">Sådan måler du dig</a>
        <a href="/">Afslut</a>
    </nav>
</header>

<main class="pagewrapper">

    <!-- Left side -->
    <section class="content">
        <h2>Beregn din størrelse</h2>
        <p>Vælg et mærke, og indtast dine mål i cm.</p>

        <form class="white-box" method="post" action="/perfectfit/calculate">
            <p class="error" th:if="${message}" th:text="${message}"></p>
            <label for="brand">Mærke</label>
            <select id="brand" name="brandId" required>
                <option value="">Vælg et mærke</option>
                <option th:each="brand : ${brands}"
                        th:value="${brand.brandId}"
                        th:text="${brand.name}"
                        th:selected="${#strings.toString(brand.brandId) == selectedBrandId}"></option>
            </select>

            <div class="measure-fields">
                <div>
                    <label for="underbust">Undermål</label>
                    <span class="cm-field">
                    <input type="number" id="underbust" name="underbust" step="0.1" min="55" max="150" th:value="${underbust}" placeholder="fx 75" required>
                    <span>cm</span>
                    </span>
                </div>
                <div>
                    <label for="bust">Brystmål</label>
                    <span class="cm-field">
                        <input type="number" id="bust" name="bust" step="0.1" min="55" max="150" th:value="${bust}" placeholder="fx 90" required>
                        <span>cm</span>
                    </span>
                </div>
            </div>

            <button type="submit">Beregn →</button>
            <a class="guide-link" href="/perfectfit/measure">Ved du ikke, hvordan du måler? Se guiden</a>
        </form>
    </section>

    <!-- Right side-->
    <section class="illustration">
        <img src="/images/teamd/woman.svg" alt="Illustration af kvinde">
    </section>

</main>

</body>
</html>
