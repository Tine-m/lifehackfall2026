<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resultat</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/teamd/tokens.css"/>
    <link rel="stylesheet" href="/css/teamd/styles.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">
    <span class="logo">PERFECTFIT</span>
    <nav>
        <a href="/perfectfit">Forside</a>
        <a href="/perfectfit/beregn">Beregn</a>
        <a href="/perfectfit/maal">Sådan måler du dig</a>
    </nav>
</header>

<main class="pagewrapper">

    <!-- Venstre side -->
    <section class="indhold">
        <p>Din størrelse hos</p>
        <h2 th:text="${brandName}">Hunkemøller</h2>
        <section class="hvid-boks centreret">
            <p class="label">DIN STØRRELSE</p>
            <p class="storrelse" th:text="${size}">75C</p>
            <span class="badge" th:text="|${sizeSystem}-størrelse|">EU-størrelse</span>
            <p class="maal" th:text="|Undermål ${underbust} cm · Brystmål ${bust} cm|">Undermål 75 cm · Brystmål 90 cm</p>
        </section>
        <section class="hvid-boks">
            <p class="label">SØSTERSTØRRELSER</p>
            <div class="soster-liste">
                <span class="soster" th:each="s : ${sisterSizes}" th:text="${s}">70D</span>
            </div>
            <p>Skålen rummer det samme. Prøv dem, hvis din størrelse er udsolgt.</p>
        </section>
        <a href="/perfectfit/beregn" class="knap">← Beregn igen</a>
    </section>

    <!-- Højre side-->
    <section class="illustration">
        <img src="/images/teamd/dame-gennemsigtig.svg" alt="Illustration af kvinde">
    </section>

</main>

</body>
</html>
