
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rediger event</title>
    <link rel="stylesheet" th:href="@{/css/teamc/styles.css}">
</head>
<body>

<div class="page-wrapper">
    <div class="hero-tagline">
        <h2 class="event-heading">
            <span class="username" th:text="${user.username}">Bruger</span>
            <span class="event-question">Rediger dit event</span>
        </h2>
    </div>

    <div class="register-card">
        <h2>Rediger event</h2>

        <form class="register-form"
              th:action="@{/eventPlanner/editEvent/{id}(id=${event.event_id})}"
              method="post">

            <label for="eventName">Navn på event:</label>
            <input type="text" id="eventName" name="eventName"
                   placeholder="Fx Biograftur"
                   th:value="${event.eventName}" required>

            <label for="startDate">Startdato:</label>
            <input type="datetime-local" id="startDate" name="startDate"
                   th:value="${startDate}" th:min="${now}" required>

            <label for="finishDate">Slutdato (valgfri):</label>
            <input type="datetime-local" id="finishDate" name="finishDate"
                   th:value="${finishDate}"
                   th:min="${startDate != null ? startDate : now}">



            <p class="invite-title">Inviter venner:</p>

            <input type="text" id="inviteSearch" class="invite-search"
                   placeholder="Søg efter navn...">

            <div class="invite-list">
                <label class="checkbox-label"
                       th:each="u : ${users}"
                       th:if="${u.user_id != user.user_id}">

                    <input type="checkbox" name="invitees"
                           th:value="${u.user_id}"
                           th:checked="${event.isInvited(u.user_id)}">

                    <span th:text="${u.username}">Navn</span>
                </label>
            </div>

            <input class="btn" type="submit" value="Gem ændringer">
        </form>

        <a class="back-link" href="/eventPlanner/myEvents">
            ← Tilbage til mine events
        </a>

        <p style="color:red;" th:if="${msg != null}"
           th:text="${msg}"></p>
    </div>
</div>

<script>
    // Søgning i "Inviter venner"
    document.getElementById("inviteSearch").addEventListener("input", function () {
        const search = this.value.toLowerCase();

        document.querySelectorAll(".invite-list .checkbox-label").forEach(function (label) {
            const name = label.textContent.toLowerCase();
            label.style.display = name.includes(search) ? "" : "none";
        });
    });

    const startDate = document.getElementById("startDate");
    const finishDate = document.getElementById("finishDate");

    // Opdaterer minimumsdato for slutdato
    function updateFinishDateMin() {
        finishDate.min = startDate.value || startDate.min;

        if (finishDate.value && finishDate.value < finishDate.min) {
            finishDate.value = "";
        }

        // Udfylder slutdato, hvis den er tom
        if (!finishDate.value && startDate.value) {
            finishDate.value = startDate.value;
        }
    }

    startDate.addEventListener("change", updateFinishDateMin);

    // Kører også, når siden åbnes
    updateFinishDateMin();
</script>

</body>
</html>
