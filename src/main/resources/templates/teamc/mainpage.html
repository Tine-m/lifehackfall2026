<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPlanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/teamc/mainpage.css}">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/eventPlanner" class="navbar-brand">EventPlanner</a>
            <div class="navbar-actions">
                <a href="/eventPlanner/inbox" class="nav-btn inbox-btn">Inbox</a>
                <a href="/eventPlanner/createEvent" class="nav-btn create-btn">Opret arrangement</a>
                <a href="/eventPlanner/myEvents" class="nav-btn">Mine events</a>
                <a href="/eventPlanner/invitedEvents" class="nav-btn">Inviteret til</a>
                <a href="/eventPlanner/profile" class="nav-btn profile-btn">Profil</a>
                <a href="/eventPlanner" class="nav-btn logout-btn">Log ud</a>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">

        <div class="welcome">
            <h1 class="welcome-heading">Velkommen</h1>
            <p class="welcome-username" th:text="${username}"></p>
        </div>

        <div class="controls">
            <form class="search-bar" action="/eventPlanner/mainpage" method="post" >
                <input
                        class="search-input"
                        type="search"
                        name="search"
                        placeholder="Søg arrangementer...">
            </form>

            <!--<div class="sort-bar">
                <label for="sort">Sortér efter:</label>
                <select id="sort" class="sort-select" name="sort">
                    <option value="date-asc">Dato (nyeste først)</option>
                    <option value="date-desc">Dato (ældste først)</option>
                    <option value="name-asc">Navn (A-Z)</option>
                    <option value="name-desc">Navn (Z-A)</option>
                    <option value="attendees-desc">Flest deltagere</option>
                    <option value="attendees-asc">Færrest deltagere</option>
                </select>
            </div>-->
        </div>

        <div class="events">
            <h2 class="section-title">Dine kommende arrangementer:</h2>

            <div class="event-list">
                <p th:if="${#lists.isEmpty(events)}">Du har ikke nogle kommende events</p>
                <ul class="event-list" th:unless="${#lists.isEmpty(events)}">
                    <li th:each="event : ${events}">
                        <div>
                            <strong th:text="${event.eventName}">Biograftur</strong><br>
                            <span class="muted" th:text="${#temporals.format(event.startDate, 'dd-MM-yyyy HH:mm')}">27-10-2026</span>
                        </div>
                        <a th:href="@{/eventPlanner/event/{id}/participants(id=${event.event_id})}">Se deltagere</a>
                    </li>
                </ul>
            </div>
        </div>

    </main>

    <script>
        const searchInput = document.querySelector(".search-input");
        searchInput.addEventListener("input", Search);

        function Search() {
            const input = searchInput.value.toLowerCase();
            const events = document.querySelectorAll("ul.event-list li");

            events.forEach(event => {
                const name = event.querySelector("strong").textContent.toLowerCase();

                if (name.includes(input)) {
                    event.style.display = "";
                } else {
                    event.style.display = "none";
                }
            });
        }

        const searchForm = document.querySelector(".search-bar");

        searchForm.addEventListener("submit", (event) => {
            event.preventDefault();
        });

    </script>

</body>
</html>
