<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>createEvent</title>
    <link rel="stylesheet" th:href="@{/css/teamc/styles.css}">

</head>
<body>

<div class="page-wrapper">
    <div class="hero-tagline">
        <h2 class="event-heading">
            <span class="username" th:text="${user.username}">Bruger</span>
            <span class="event-question">Hvad skal I lave?</span>
        </h2>
    </div>

    <div class="register-card">
        <h2>Opret event</h2>

        <form class="register-form" action="/eventPlanner/createEvent" method="post">

            <label for="eventName">Navn på event:</label>
            <input type="text" id="eventName" name="eventName" placeholder="Fx Biograftur"
                   th:value="${eventName}" required>

            <label for="startDate">Startdato:</label>
            <input type="datetime-local" id="startDate" name="startDate" th:value="${startDate}" th:min="${now}" required>

            <label for="finishDate">Slutdato (valgfri):</label>
            <input type="datetime-local" id="finishDate" name="finishDate"
                   th:value="${finishDate}" th:min="${startDate != null ? startDate : now}">

            <label class="checkbox-label">
                <input type="checkbox" name="restrictComments" th:checked="${restrictComments}">
                Begræns kommentarer
            </label>

            <input class="btn" type="submit" value="Opret event">
        </form>

        <a class="btn login-link" href="/eventPlanner/myEvents">Mine events</a> <br>
        <a class="back-link" href="/eventPlanner/mainpage">
            ← Tilbage til forsiden
        </a>

        <p style="color:red;" th:if="${msg != null}" th:text="${msg}"></p>
    </div>
</div>


<script>
    const startDate = document.getElementById("startDate");
    const finishDate = document.getElementById("finishDate");

    function updateFinishDateMin() {
        finishDate.min = startDate.value || startDate.min;

        if (finishDate.value && finishDate.value < finishDate.min) {
            finishDate.value = "";
        }
    }

    startDate.addEventListener("change", updateFinishDateMin);

    updateFinishDateMin();

    // Udfylder slut automatisk med samme dato og tid som start, hvis den er tom
    document.getElementById("startDate").addEventListener("change", function () {
    const finish = document.getElementById("finishDate");
    if (!finish.value) {
    finish.value = this.value;
    }
    });
</script>

</body>
</html>
