<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPlanner — Inviteret til</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/teamc/styles.css}">
</head>
<body>

<div class="page-wrapper">

  <div class="register-card">
    <h2>Inviteret til</h2>

    <p style="color:red;" th:if="${msg != null}" th:text="${msg}"></p>

    <p th:if="${#lists.isEmpty(events)}">Du er ikke inviteret til nogen events endnu.</p>

    <ul class="event-list" th:unless="${#lists.isEmpty(events)}">
      <li th:each="event : ${events}">
        <div>
          <strong th:text="${event.eventName}">Biograftur</strong><br>
          <span class="muted">
                        <span th:text="${#temporals.format(event.startDate, 'dd-MM-yyyy HH:mm')}">27-10-2026 19:00</span>
                        &middot; af <span th:text="${event.user.username}">Cezary</span>
                    </span>
        </div>
        <a th:href="@{/eventPlanner/event/{id}(id=${event.event_id})}">Se og kommentér</a>
      </li>
    </ul>

    <a class="btn login-link" href="/eventPlanner/mainpage">Tilbage til forsiden</a>
  </div>

</div>

</body>
</html>
