<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPlanner — Mine events</title>
    <title>Mine events</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/teamc/styles.css}">
</head>
<body>

<div class="page-wrapper">

  <div class="register-card">
    <h2>Mine kommende events</h2>

    <p class="flash" th:if="${flash != null}" th:text="${flash}"></p>

    <p th:if="${#lists.isEmpty(events)}">Du har ikke oprettet nogen events endnu.</p>

    <ul class="event-list" th:unless="${#lists.isEmpty(events)}">
      <li th:each="event : ${events}">
        <div>
          <strong th:text="${event.eventName}">Biograftur</strong><br>
          <span class="muted" th:text="${#temporals.format(event.startDate, 'dd-MM-yyyy HH:mm')}">27-10-2026</span>
        </div>
        <!--<a th:href="@{/eventPlanner/event/{id}/participants(id=${event.event_id})}">Se deltagere</a>-->
        <a class="edit-btn"
           th:href="@{/eventPlanner/editEvent/{id}(id=${event.event_id})}">
          Edit
        </a>
      </li>
    </ul>

    <a class="btn" href="/eventPlanner/createEvent">Opret nyt event</a>
  </div>

  <a class="back-link" href="/eventPlanner/mainpage">
    ← Tilbage til forsiden
  </a>

</div>


</body>
</html>
